<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setuphelfer</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8;
      --accent: #22c55e; --warn: #f59e0b; --fail: #ef4444;
      --font: "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); font-family: var(--font);
      background: radial-gradient(1200px 600px at 20% 0%, #1e3a5f 0%, var(--bg) 55%);
      display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .card {
      width: min(760px, 100%); background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid #334155; border-radius: 16px; padding: 2rem 2.25rem;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .35rem; font-size: 1.75rem; }
    .brand span { color: var(--accent); }
    .sub { color: var(--muted); margin: 0 0 1.35rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; margin: .55rem 0; }
    .label { color: var(--muted); }
    .value { font-weight: 600; text-align: right; word-break: break-all; }
    .pill {
      display: inline-block; padding: .2rem .7rem; border-radius: 999px;
      font-size: .85rem; font-weight: 700; text-transform: uppercase;
    }
    .running, .waiting { background: #422006; color: var(--warn); }
    .passed { background: #14532d; color: var(--accent); }
    .failed, .blocked, .cancelled { background: #7f1d1d; color: #fecaca; }
    .hint { margin-top: 1.35rem; color: var(--muted); line-height: 1.45; }
    .bar { margin-top: 1.1rem; height: 10px; background: #0b1220; border-radius: 999px; overflow: hidden; }
    .bar > i {
      display: block; height: 100%; width: 10%;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0% { transform: translateX(-30%); } 50% { transform: translateX(480%); } 100% { transform: translateX(-30%); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <h1 class="brand"><span id="title">Setuphelfer</span></h1>
    <p class="sub" id="subtitle">…</p>
    <div class="row"><span class="label" id="l_status">Status</span><span class="value"><span id="status" class="pill waiting">…</span></span></div>
    <div class="row"><span class="label" id="l_phase">Phase</span><span class="value" id="phase">—</span></div>
    <div class="row"><span class="label" id="l_progress">Progress</span><span class="value" id="progress">—</span></div>
    <div class="row"><span class="label" id="l_run">Run-ID</span><span class="value" id="run">—</span></div>
    <div class="row"><span class="label" id="l_payload">Payload</span><span class="value" id="payload">—</span></div>
    <div class="bar" id="bar"><i></i></div>
    <p class="hint" id="hint">…</p>
  </main>
  <script>
    const TERMINAL = new Set(["passed", "failed", "blocked", "cancelled"]);
    let i18n = {
      title: "Setuphelfer",
      subtitle: "Automated lab run",
      status: "Status",
      phase: "Phase",
      progress: "Progress",
      run_id: "Run-ID",
      payload: "Payload",
      hint_running: "No input required.",
      hint_passed: "Run passed.",
      hint_failed: "Run ended."
    };

    function applyI18n() {
      document.getElementById("title").textContent = i18n.title;
      document.getElementById("subtitle").textContent = i18n.subtitle;
      document.getElementById("l_status").textContent = i18n.status;
      document.getElementById("l_phase").textContent = i18n.phase;
      document.getElementById("l_progress").textContent = i18n.progress;
      document.getElementById("l_run").textContent = i18n.run_id;
      document.getElementById("l_payload").textContent = i18n.payload;
      document.title = i18n.title;
    }

    async function loadLocale() {
      let loc = "de-DE";
      try {
        const h = await fetch("/health.json", { cache: "no-store" });
        if (h.ok) {
          const hj = await h.json();
          if (hj.locale) loc = hj.locale;
          if (hj.payload_version) document.getElementById("payload").textContent = hj.payload_version;
        }
      } catch (_) {}
      try {
        const r = await fetch("/locales/" + loc + ".json", { cache: "no-store" });
        if (r.ok) i18n = Object.assign(i18n, await r.json());
        else {
          const r2 = await fetch("/locales/en-US.json", { cache: "no-store" });
          if (r2.ok) i18n = Object.assign(i18n, await r2.json());
        }
      } catch (_) {}
      applyI18n();
      document.documentElement.lang = loc.slice(0, 2);
    }

    function paint(data) {
      const status = (data && data.status) || "waiting";
      const pill = document.getElementById("status");
      pill.textContent = status;
      pill.className = "pill " + status;
      document.getElementById("phase").textContent =
        (data && (data.phase_label || data.phase_label_de || data.phase)) || "—";
      document.getElementById("progress").textContent = (data && data.last_progress) || "—";
      document.getElementById("run").textContent = (data && data.run_id) || "—";
      if (data && data.payload_version) document.getElementById("payload").textContent = data.payload_version;
      document.getElementById("bar").style.display = TERMINAL.has(status) ? "none" : "block";
      if (status === "passed") document.getElementById("hint").textContent = i18n.hint_passed;
      else if (TERMINAL.has(status)) document.getElementById("hint").textContent = i18n.hint_failed;
      else document.getElementById("hint").textContent = i18n.hint_running;
    }

    async function tick() {
      try {
        const r = await fetch("/api/rescue/auto-e2e-status", { cache: "no-store" });
        if (r.ok) paint(await r.json());
      } catch (_) {
        paint({ status: "waiting", phase_label: i18n.subtitle, last_progress: "", run_id: "" });
      }
    }

    loadLocale().then(() => { tick(); setInterval(tick, 1500); });
  </script>
</body>
</html>
