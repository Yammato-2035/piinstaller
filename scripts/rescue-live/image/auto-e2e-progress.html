<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setuphelfer – Auto Backup / Verify / Restore</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --warn: #f59e0b;
      --fail: #ef4444;
      --font: "Segoe UI", "DejaVu Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% 0%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      width: min(720px, 100%);
      background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .35rem; font-size: 1.75rem; letter-spacing: -.02em; }
    .brand span { color: var(--accent); }
    .sub { color: var(--muted); margin: 0 0 1.5rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; margin: .65rem 0; }
    .label { color: var(--muted); }
    .value { font-weight: 600; text-align: right; word-break: break-all; }
    .status-pill {
      display: inline-block;
      padding: .2rem .7rem;
      border-radius: 999px;
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .running, .waiting { background: #422006; color: var(--warn); }
    .passed { background: #14532d; color: var(--accent); }
    .failed, .blocked, .cancelled { background: #7f1d1d; color: #fecaca; }
    .idle { background: #334155; color: #cbd5e1; }
    .hint { margin-top: 1.5rem; color: var(--muted); font-size: .95rem; line-height: 1.45; }
    .bar {
      margin-top: 1.25rem;
      height: 10px;
      background: #0b1220;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 8%;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: translateX(-20%); }
      50% { transform: translateX(520%); }
      100% { transform: translateX(-20%); }
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <h1 class="brand">Setup<span>helfer</span></h1>
    <p class="sub">Automatischer Lab-Lauf: Backup → Verify → Restore (SABRENT)</p>
    <div class="row"><span class="label">Status</span><span class="value"><span id="status" class="status-pill idle">…</span></span></div>
    <div class="row"><span class="label">Phase</span><span class="value" id="phase">—</span></div>
    <div class="row"><span class="label">Fortschritt</span><span class="value" id="progress">—</span></div>
    <div class="row"><span class="label">Run-ID</span><span class="value" id="run">—</span></div>
    <div class="bar" id="bar"><i></i></div>
    <p class="hint" id="hint">Keine Bedienung nötig. Der Lauf speichert Evidence auf SETUP_LOGS und fährt danach herunter.</p>
  </main>
  <script>
    const el = (id) => document.getElementById(id);
    const TERMINAL = new Set(["passed", "failed", "blocked", "cancelled"]);

    function paint(data) {
      const status = (data && data.status) || "waiting";
      const pill = el("status");
      pill.textContent = status;
      pill.className = "status-pill " + status;
      el("phase").textContent = (data && (data.phase_label_de || data.phase)) || "—";
      el("progress").textContent = (data && data.last_progress) || "—";
      el("run").textContent = (data && data.run_id) || "—";
      el("bar").style.display = TERMINAL.has(status) ? "none" : "block";
      if (status === "passed") {
        el("hint").textContent = "Lauf bestanden. Herunterfahren folgt automatisch.";
      } else if (status === "failed" || status === "blocked" || status === "cancelled") {
        el("hint").textContent = "Lauf beendet mit Status " + status + ". Evidence prüfen, Stick zurückbringen.";
      }
    }

    async function tick() {
      try {
        let data = null;
        try {
          const r = await fetch("/api/rescue/auto-e2e-status", { cache: "no-store" });
          if (r.ok) data = await r.json();
        } catch (_) {}
        if (!data) {
          const r2 = await fetch("/auto-e2e-state.json", { cache: "no-store" });
          if (r2.ok) {
            const s = await r2.json();
            data = {
              status: s.status || "waiting",
              phase: s.phase || "",
              phase_label_de: s.phase || "",
              last_progress: s.last_progress || "",
              run_id: s.run_id || "",
            };
          }
        }
        if (data) paint(data);
      } catch (_) {
        paint({ status: "waiting", phase_label_de: "Warte auf Auto-E2E-State…", last_progress: "", run_id: "" });
      }
    }

    tick();
    setInterval(tick, 1500);
  </script>
</body>
</html>
