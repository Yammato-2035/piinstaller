# Setuphelfer Rettungsstick — custom boot labels (included from live.cfg.in)
label setuphelfer-rescue-default
	menu label ^Setuphelfer Rettung starten
	menu default
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1

label setuphelfer-rescue-network
	menu label Setuphelfer Rettung mit Netzwerk-Assistent
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_network_onboarding=1 setuphelfer_start_assistant=1

label setuphelfer-rescue-msi-compat
	menu label Setuphelfer MSI/NVIDIA-Kompatibilitaetsmodus
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ pci=noaer nomodeset setuphelfer_msi_compat=1

label setuphelfer-rescue-diagnose
	menu label Setuphelfer Diagnosemodus ohne Aenderungen
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_diagnose=1 systemd.log_level=debug

label setuphelfer-rescue-toram
	menu label Setuphelfer Start in RAM / Media-Check
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config toram @LB_BOOTAPPEND_LIVE@ setuphelfer_media_check=1

label setuphelfer-asus-00
	menu label ASUS-00 FORENSIC TUI SAFE
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=text setuphelfer_kiosk=0 setuphelfer_safe_ui=1 setuphelfer_collect_diagnostics=1 nomodeset setuphelfer_asus_profile=ASUS-00 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-01
	menu label ASUS-01 AMD DISCOVERY
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=text setuphelfer_kiosk=0 pci=noaer modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nouveau setuphelfer_asus_profile=ASUS-01 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-02
	menu label ASUS-02 AMD GUI
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=gui setuphelfer_kiosk=1 setuphelfer_gui_watchdog=1 pci=noaer modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nouveau setuphelfer_asus_profile=ASUS-02 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-03
	menu label ASUS-03 HYBRID OPEN DRIVER DIAGNOSTIC
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=text setuphelfer_kiosk=0 pci=noaer setuphelfer_asus_profile=ASUS-03 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-04
	menu label ASUS-04 NVIDIA MODULE COMPATIBILITY
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=text setuphelfer_kiosk=0 setuphelfer_asus_profile=ASUS-04 setuphelfer_nvidia_diag_only=1 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-05
	menu label ASUS-05 FULL GUI CANDIDATE
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=gui setuphelfer_kiosk=1 setuphelfer_gui_watchdog=1 setuphelfer_asus_profile=ASUS-05 setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-asus-recovery
	menu label ASUS-RECOVERY FORCED TUI FALLBACK
	kernel @KERNEL@
	append initrd=@INITRD@ boot=live config @LB_BOOTAPPEND_LIVE@ setuphelfer_start_assistant=1 setuphelfer_mode=text setuphelfer_kiosk=0 setuphelfer_safe_ui=1 setuphelfer_collect_diagnostics=1 nomodeset setuphelfer_asus_profile=ASUS-RECOVERY setuphelfer_msi_lab_auto=0 setuphelfer_auto_discovery=0 setuphelfer_telemetry_opt_in=1

label setuphelfer-rescue-reboot
	menu label ^Neustart
	COM32 reboot.c32

label setuphelfer-rescue-poweroff
	menu label ^Herunterfahren
	COM32 poweroff.c32
