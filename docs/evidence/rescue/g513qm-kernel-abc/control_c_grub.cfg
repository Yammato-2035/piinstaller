menuentry "Linux Mint 22.2 Installer (ISO-Loopback, Fallback)" {
  insmod part_gpt
  insmod fat
  insmod loopback
  insmod iso9660
  set gfxpayload=text
  search --no-floppy --fs-uuid 9BC7-3950 --set=root
  if [ -z "$root" ]; then
    search --no-floppy --label SETUP_LOGS --set=root
  fi
  set isofile="/setuphelfer/iso-cache/linux_mint/linuxmint-22.2-cinnamon-64bit.iso"
  loopback loop $isofile
  linux (loop)/casper/vmlinuz boot=casper iso-scan/filename=$isofile ignore_uuid pci=noaer nouveau.modeset=0 modprobe.blacklist=nouveau,hid_asus,asus_nb_wmi,asus_wmi amdgpu.modeset=0 radeon.modeset=0 nomodeset noplymouth console=tty0 consoleblank=0 systemd.debug-shell=1 noeject fsck.mode=skip systemd.unit=multi-user.target --- 
  initrd (loop)/casper/initrd.lz
}

