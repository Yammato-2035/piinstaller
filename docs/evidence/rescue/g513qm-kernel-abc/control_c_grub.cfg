set timeout=30
set timeout_style=menu
set default=0
search --no-floppy --fs-uuid 9BB9-A4A6 --set=root
if [ -z "$root" ]; then
  search --no-floppy --label SETUPHELFER --set=root
fi
if [ -z "$root" ]; then
  set root=($cmdpath)
fi

insmod all_video
insmod efi_gop
insmod efi_uga
insmod video
insmod gfxterm
insmod loopback
insmod iso9660
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
terminal_input console
set menu_color_normal=white/black
set menu_color_highlight=black/white
menuentry "G513QM Basic Emergency — STANDARD (nomodeset, root+Enter)" {
  insmod part_gpt
  insmod fat
  set gfxpayload=text
  search --no-floppy --fs-uuid 9BC7-3950 --set=root
  if [ -z "$root" ]; then
    search --no-floppy --label SETUP_LOGS --set=root
  fi
  if [ -z "$root" ]; then
    search --no-floppy --label SETUP_LOGS2 --set=root
  fi
  linux /mint-live/vmlinuz boot=casper live-media=/dev/disk/by-uuid/9BC7-3950 live-media-path=mint-live ignore_uuid username=mint hostname=mint pci=noaer noplymouth console=tty0 consoleblank=0 fbcon=nodefer noeject fsck.mode=skip systemd.debug-shell=1 setuphelfer_capture=1 setuphelfer_g513qm_profile=g513qm_basic_emergency nouveau.modeset=0 modprobe.blacklist=nouveau,hid_asus,asus_nb_wmi,asus_wmi amdgpu.modeset=0 radeon.modeset=0 nomodeset systemd.unit=rescue.target systemd.mask=lightdm.service systemd.mask=mdm.service systemd.mask=gdm3.service systemd.mask=gdm.service systemd.mask=cups.service systemd.mask=cups-browsed.service --- 
  initrd /mint-live/initrd.lz
}
